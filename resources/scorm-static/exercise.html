<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reading exercise</title>
    <link rel="stylesheet" href="reader.css">
    <script src="reading.js" defer></script>
</head>
<body class="font-sans text-ink">
    <main class="max-w-3xl space-y-3 p-4 wrap-anywhere sm:p-6">
        <h1 class="text-2xl font-semibold">Reading exercise</h1>
        <p class="whitespace-pre-wrap" id="lesson"></p>
        <label class="block font-semibold" for="note">Reading note</label>
        <textarea class="block min-h-11 w-full min-w-0 rounded-md border border-neutral-500 p-2 resize-y" id="note" rows="4" maxlength="4096" aria-describedby="note-hint"></textarea>
        <p class="text-sm text-neutral-600" id="note-hint">Pause to keep your place. Completing the reading makes your note final.</p>
        <div class="flex flex-wrap gap-3">
            <button class="min-h-11 rounded-md bg-forest px-4 py-2 font-semibold text-white hover:underline disabled:opacity-60" type="button" id="pause" disabled>Save and pause</button>
            <button class="min-h-11 rounded-md border border-forest px-4 py-2 font-semibold text-forest hover:underline disabled:opacity-60" type="button" id="finish" disabled>Complete reading</button>
        </div>
        <p class="border-l-4 border-brand bg-canvas p-3" id="status" role="status">Opening reading…</p>
    </main>
</body>
</html>
