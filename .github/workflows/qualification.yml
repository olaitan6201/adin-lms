name: Qualification
on: [pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, bcmath, dom, fileinfo, gd, intl, mbstring, xml, zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  database:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        engine: [sqlite, pgsql, mysql]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, pdo_pgsql, pdo_mysql, bcmath, dom, fileinfo, gd, intl, mbstring, pcntl, xml, zip
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - name: Prepare disposable PostgreSQL database
        if: matrix.engine == 'pgsql'
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -c "CREATE USER qa WITH PASSWORD 'local_test_only'"
          sudo -u postgres createdb -O qa qa_suite
      - name: Prepare disposable MySQL database
        if: matrix.engine == 'mysql'
        run: |
          sudo systemctl start mysql
          mysql -uroot -proot -e "CREATE DATABASE qa_suite; CREATE USER 'qa'@'localhost' IDENTIFIED BY 'local_test_only'; GRANT ALL ON qa_suite.* TO 'qa'@'localhost';"
      - name: Native suite on a fresh database
        env:
          DB_CONNECTION: ${{ matrix.engine }}
          DB_DATABASE: ${{ matrix.engine == 'sqlite' && ':memory:' || 'qa_suite' }}
          DB_HOST: 127.0.0.1
          DB_USERNAME: qa
          DB_PASSWORD: local_test_only
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction
          vendor/bin/phpunit --fail-on-skipped
      - name: Verify concurrent roster replay and exam recovery
        if: matrix.engine != 'sqlite'
        run: bash tests/operations/rehearse.sh "${{ matrix.engine }}" extended
